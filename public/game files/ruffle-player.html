<!doctype html>
<html>
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Fish Proxy | Flash</title>
	<meta name="googlebot" content="noindex, nofollow" />
	<style>
		* { margin: 0; padding: 0; box-sizing: border-box; }
		html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
		#err {
			display: none;
			position: fixed; inset: 0;
			align-items: center; justify-content: center;
			background: #000;
			color: rgba(255,255,255,0.55);
			font-family: Arial, sans-serif;
			font-size: 15px;
			text-align: center;
			padding: 20px;
		}
		#err.show { display: flex; }
	</style>
</head>
<body>
	<div id="err"></div>

	<script>
		const params = new URLSearchParams(location.search);
		const swf    = params.get("swf");

		const errEl = document.getElementById("err");
		function showErr(msg) {
			errEl.textContent = msg;
			errEl.classList.add("show");
		}

		if (!swf) {
			showErr("Missing parameter. Expected: ?swf=/path/to/game.swf");
		} else {
			window.RufflePlayer = window.RufflePlayer || {};

			const s = document.createElement("script");
			s.src = "https://unpkg.com/@ruffle-rs/ruffle";
			s.onload = () => {
				const ruffle = window.RufflePlayer.newest();
				if (!ruffle) { showErr("Ruffle failed to initialize."); return; }

				const player = ruffle.createPlayer();
				player.style.cssText = "width:100%;height:100%;display:block;";
				document.body.appendChild(player);
				player.load({ url: swf, allowScriptAccess: "always" })
					.catch(e => showErr("Could not load SWF: " + e.message));
			};
			s.onerror = () => showErr("Failed to load Ruffle from CDN. Check your connection.");
			document.body.appendChild(s);
		}
	</script>
</body>
</html>
